<div class="theme-dropdown">
  <button
    type="button"
    class="theme-trigger"
    [attr.aria-expanded]="open()"
    aria-haspopup="listbox"
    (click)="toggleOpen()"
  >
    Themes
    <span class="caret">▾</span>
  </button>

  @if (open()) {
    <ul class="theme-menu" role="listbox">
      @for (option of options; track option.value) {
        <li>
          <button
            type="button"
            role="option"
            [attr.aria-selected]="ranking.theme() === option.value"
            [class.active]="ranking.theme() === option.value"
            (click)="select(option.value)"
          >
            {{ option.label }}
          </button>
        </li>
      }
    </ul>
  }
</div>
