<section class="xy-graph">
  @if (axes(); as a) {
    @let xc = a.xc;
    @let yc = a.yc;
    <h2>{{ xc.name }} vs {{ yc.name }}</h2>
      <p class="hint">Drag the points to adjust each object's values for both criteria.</p>

      <svg [attr.viewBox]="'0 0 ' + viewboxSize + ' ' + viewboxSize" class="graph-svg">
        <defs>
          <linearGradient
            id="xyGradient"
            gradientUnits="userSpaceOnUse"
            [attr.x1]="gradientCorners().x1"
            [attr.y1]="gradientCorners().y1"
            [attr.x2]="gradientCorners().x2"
            [attr.y2]="gradientCorners().y2"
          >
            <stop offset="0%" stop-color="hsl(0, 55%, 85%)" />
            <stop offset="50%" stop-color="hsl(55, 55%, 85%)" />
            <stop offset="100%" stop-color="hsl(120, 45%, 82%)" />
          </linearGradient>
        </defs>

        <rect
          [attr.x]="axisLeftX"
          [attr.y]="axisTopY"
          [attr.width]="axisRightX - axisLeftX"
          [attr.height]="axisBottomY - axisTopY"
          fill="url(#xyGradient)"
        />

        <!-- gridlines -->
        @for (tick of ticks; track tick) {
          <line
            [attr.x1]="axisLeftX"
            [attr.x2]="axisRightX"
            [attr.y1]="axisBottomY - ((tick - 1) / 9) * (axisBottomY - axisTopY)"
            [attr.y2]="axisBottomY - ((tick - 1) / 9) * (axisBottomY - axisTopY)"
            class="gridline"
          />
          <line
            [attr.y1]="axisTopY"
            [attr.y2]="axisBottomY"
            [attr.x1]="axisLeftX + ((tick - 1) / 9) * (axisRightX - axisLeftX)"
            [attr.x2]="axisLeftX + ((tick - 1) / 9) * (axisRightX - axisLeftX)"
            class="gridline"
          />
          <text
            [attr.x]="axisLeftX - 10"
            [attr.y]="axisBottomY - ((tick - 1) / 9) * (axisBottomY - axisTopY) + 4"
            class="tick-label"
            text-anchor="end"
          >
            {{ tick }}
          </text>
          <text
            [attr.x]="axisLeftX + ((tick - 1) / 9) * (axisRightX - axisLeftX)"
            [attr.y]="axisBottomY + 16"
            class="tick-label"
            text-anchor="middle"
          >
            {{ tick }}
          </text>
        }

        <!-- axis lines -->
        <line
          [attr.x1]="axisLeftX"
          [attr.x2]="axisLeftX"
          [attr.y1]="axisTopY"
          [attr.y2]="axisBottomY"
          class="axis-line"
        />
        <line
          [attr.x1]="axisLeftX"
          [attr.x2]="axisRightX"
          [attr.y1]="axisBottomY"
          [attr.y2]="axisBottomY"
          class="axis-line"
        />

        <!-- axis titles -->
        <text
          [attr.x]="(axisLeftX + axisRightX) / 2"
          [attr.y]="viewboxSize - 12"
          class="axis-title"
          text-anchor="middle"
        >
          {{ xc.name }}
        </text>
        <text
          [attr.x]="-((axisTopY + axisBottomY) / 2)"
          y="18"
          class="axis-title"
          text-anchor="middle"
          transform="rotate(-90)"
        >
          {{ yc.name }}
        </text>

        <!-- points -->
        @for (group of groups(); track group.key) {
          @if (group.members.length === 1) {
            <!-- standalone point: just a dot; hover (or drag) reveals its name -->
            <g
              class="point-group"
              [class.dragging]="draggingId() === group.members[0].id"
              (pointerenter)="hoveredSingleId.set(group.members[0].id)"
              (pointerleave)="hoveredSingleId.set(null)"
              (pointerdown)="onPointerDown($event, group.members[0].id)"
              (pointermove)="onPointerMove($event)"
              (pointerup)="onPointerUp($event)"
              (pointercancel)="onPointerUp($event)"
            >
              @if (hoveredSingleId() === group.members[0].id || draggingId() === group.members[0].id) {
                <text [attr.x]="group.x" [attr.y]="group.y - 14" class="point-label" text-anchor="middle">
                  {{ group.members[0].name }}
                </text>
              }
              <circle [attr.cx]="group.x" [attr.cy]="group.y" r="9" class="point-circle" />
            </g>
          } @else if (activeGroupKey() === group.key) {
            <!-- expanded: spread members around their shared spot so each is individually draggable -->
            <g (pointerleave)="collapseGroup(group.key)">
              <circle
                [attr.cx]="group.x"
                [attr.cy]="group.y"
                [attr.r]="clusterHoverRadius(group.members.length)"
                class="hover-zone"
              />
              @for (point of expandedPoints(); track point.id) {
                <g
                  class="point-group"
                  [class.dragging]="draggingId() === point.id"
                  (pointerdown)="onPointerDown($event, point.id)"
                  (pointermove)="onPointerMove($event)"
                  (pointerup)="onPointerUp($event)"
                  (pointercancel)="onPointerUp($event)"
                >
                  <line
                    [attr.x1]="group.x"
                    [attr.y1]="group.y"
                    [attr.x2]="point.x"
                    [attr.y2]="point.y"
                    class="leader-line"
                  />
                  <text [attr.x]="point.x" [attr.y]="point.y - 14" class="point-label" text-anchor="middle">
                    {{ point.name }}
                  </text>
                  <circle [attr.cx]="point.x" [attr.cy]="point.y" r="9" class="point-circle" />
                </g>
              }
            </g>
          } @else {
            <!-- collapsed group: one dot + a count badge; hover to spread apart -->
            <g class="point-group group-dot" (pointerenter)="expandGroup(group.key)">
              <circle [attr.cx]="group.x" [attr.cy]="group.y" r="9" class="point-circle" />
              <text [attr.x]="group.x" [attr.y]="group.y - 14" class="group-badge" text-anchor="middle">
                ({{ group.members.length }})
              </text>
            </g>
          }
        }
      </svg>
  } @else {
    <p class="empty-state">Select two criteria to see the XY graph.</p>
  }
</section>
