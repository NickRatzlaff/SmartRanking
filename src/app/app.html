<header class="app-header">
  <h1>Smart Ranking</h1>
</header>

<main class="app-layout">
  @switch (ranking.selectedCriteriaIds().length) {
    @case (1) {
      <app-criterion-graph />
    }
    @case (2) {
      <div class="placeholder">Two-criteria XY graph — coming next.</div>
    }
    @default {
      <app-ranking-list />
    }
  }
  <app-criteria-panel />
</main>
