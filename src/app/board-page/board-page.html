<app-header>
  <app-theme-selector />
  <button type="button" class="share-btn" (click)="copyShareLink()">
    {{ linkCopied() ? 'Link copied!' : 'Share link' }}
  </button>
  <button
    type="button"
    class="settings-btn"
    [title]="ranking.objectName() + ' field settings'"
    (click)="showFieldsSettings.set(true)"
  >
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"
      />
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9.6a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.604.852 1 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"
      />
    </svg>
  </button>
</app-header>

@if (showFieldsSettings()) {
  <app-fields-settings (closed)="showFieldsSettings.set(false)" />
}

@if (ranking.loading()) {
  <p class="loading">Loading board…</p>
} @else {
  <main class="app-layout">
    <app-criteria-panel />
    @switch (ranking.selectedCriteriaIds().length) {
      @case (1) {
        <app-criterion-graph />
      }
      @case (2) {
        <app-xy-graph />
      }
      @default {
        <app-ranking-list />
      }
    }
  </main>
}
