<app-header>
  <button type="button" class="share-btn" (click)="copyShareLink()">
    {{ linkCopied() ? 'Link copied!' : 'Copy share link' }}
  </button>
</app-header>

@if (ranking.loading()) {
  <p class="loading">Loading board…</p>
} @else {
  <main class="app-layout">
    <app-criteria-panel />
    @switch (ranking.selectedCriteriaIds().length) {
      @case (1) {
        <app-criterion-graph />
      }
      @case (2) {
        <app-xy-graph />
      }
      @default {
        <app-ranking-list />
      }
    }
  </main>
}
